<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Almendra+SC&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Kotta+One&family=Matemasie&family=Stardos+Stencil:wght@400;700&family=Ultra&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Matemasie&family=Stardos+Stencil:wght@400;700&family=Ultra&display=swap');
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-video">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="videos/background-video.mp4" type="video/mp4">
        </video>
    </div>

    <div class="container">
        <div class="weather-card">
            <div class="header">
                <h2><span class="title1">Weather</span><span class="title2">App</span></h2>
                <div class="live-status">
                    <span class="live-dot"></span>
                    <span class="live-text">Live Data</span>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-location-dot locationIcon"></i>
                <input type="text" placeholder="Search City..." autocomplete="off" id="searchInput">
                <i class="fa-solid fa-magnifying-glass searchIcon"></i>
                <div id="suggestions"></div>
            </div>

            <div class="weather-info">
                <div class="weatherHeroImg">
                    <img src="images/icon1.png" alt="Weather Icon" id="icon">
                </div>

                <div class="weatherInfoHero">
                    <h2 id="cityName">Colombo, Sri Lanka</h2>
                    <h1 id="temp">30°C</h1>
                    <p id="condition">Clear Sky</p>
                    <div class="heroCards">
                        <div class="heroDetailCard">
                            <img src="images/feels.webp" class="weatherHeroIcon">
                            <div>
                                <p class="heroCardp">Feels Like</p>
                                <span id="feelsLike">31°C</span>
                            </div>
                        </div>

                        <div class="heroDetailCard">
                            <img src="images/weather.webp" class="weatherHeroIcon">
                            <div>
                                <p class="heroCardp">Humidity</p>
                                <span id="humidity">70%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="details">
                <div class="detail-card">
                    <img src="images/wind.webp" class="detailCardIcon">
                    <div class="detailCardInfo">
                        <p>Wind Speed</p>
                        <span id="wind">10 km/h</span>
                    </div>
                </div>

                <div class="detail-card">
                    <img src="images/pressure.webp" class="detailCardIcon">
                    <div class="detailCardInfo">
                        <p>Pressure</p>
                        <span id="pressure">1009 hpa</span>
                    </div>
                </div>
            </div>

            <div class="forecast-section">
                <div id="forecast">

                </div>
            </div>

            <div class="footer">
                <p id="lastUpdate">Last Updated : </p>
            </div>


        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
